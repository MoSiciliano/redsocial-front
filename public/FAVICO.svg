<!-- sparkit-icon.svg (1024x1024, fondo transparente) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6B5EFF"></stop>
      <stop offset="0.6" stop-color="#00D7FF"></stop>
      <stop offset="1" stop-color="#FF4D6D"></stop>
    </linearGradient>
    <filter id="f1" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000" flood-opacity="0.35"></feDropShadow>
    </filter>
  </defs>

  <!-- círculo exterior (opcional para versiones con fondo) -->
  <!-- <circle cx="512" cy="512" r="500" fill="#0A0E27"/> -->

  <!-- conexiones -->
  <g filter="url(#f1)" transform="translate(0,0)">
    <path d="M512 224 L592 368 L736 400 L608 512 L656 656 L512 584 L368 656 L416 512 L288 400 L432 368 Z" fill="url(#g1)" opacity="0.98"></path>
    <!-- nodos -->
    <circle cx="512" cy="224" r="36" fill="#F0F3FF"></circle>
    <circle cx="736" cy="400" r="28" fill="#F0F3FF"></circle>
    <circle cx="656" cy="656" r="24" fill="#F0F3FF"></circle>
    <circle cx="368" cy="656" r="20" fill="#F0F3FF"></circle>
    <circle cx="288" cy="400" r="24" fill="#F0F3FF"></circle>
    <circle cx="592" cy="368" r="22" fill="#F0F3FF"></circle>
  </g>
</svg>
