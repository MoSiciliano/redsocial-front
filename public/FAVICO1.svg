<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Gradiente animado -->
    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5EFF">
        <animate attributeName="stop-color" values="#6B5EFF;#00D7FF;#FF4D6D;#6B5EFF" dur="5s" repeatCount="indefinite"></animate>
      </stop>
      <stop offset="100%" stop-color="#FF4D6D">
        <animate attributeName="stop-color" values="#FF4D6D;#00D7FF;#6B5EFF;#FF4D6D" dur="5s" repeatCount="indefinite"></animate>
      </stop>
    </linearGradient>

    <!-- Animación -->
    <style>
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.95; }
      }
      @keyframes rotateGradient {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .spark {
        transform-origin: center;
        animation: pulse 3s ease-in-out infinite;
        filter: drop-shadow(0 0 10px rgba(255,255,255,0.4));
      }
    </style>
  </defs>

  <!-- Fondo transparente -->
  <rect width="200" height="200" fill="transparent"></rect>

  <!-- Estrella -->
  <polygon class="spark" points="100,20 118,75 175,75 130,110 145,170 100,135 55,170 70,110 25,75 82,75" fill="url(#sparkGradient)"></polygon>
</svg>
