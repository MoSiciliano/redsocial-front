<form
  [formGroup]="postForm"
  (ngSubmit)="onSubmit()"
  class="mb-6 w-full max-w-2xl mx-auto rounded-xl border border-muted/20 bg-card/60 p-6 shadow-lg backdrop-blur-lg animate-fade-in"
>
  <div class="flex items-start gap-4">
    <img
      [src]="currentUser()?.imageProfile"
      alt="Tu avatar"
      class="h-12 w-12 rounded-full border-2 border-primary/50 object-cover"
    />

    <div class="flex-1">
      <div class="relative mb-3">
        <textarea
          id="message"
          formControlName="message"
          rows="4"
          class="peer block w-full appearance-none rounded-t-lg border-b-2 border-muted bg-card/50 px-3 py-3 text-maintext placeholder-transparent focus:border-primary focus:outline-none focus:ring-0"
          placeholder="Mensaje"
        ></textarea>
        <label
          for="message"
          class="absolute top-4 left-3 z-10 origin-[0] -translate-y-6 scale-75 transform text-sm text-muted duration-300 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-6 peer-focus:scale-75 peer-focus:text-primary"
        >
          ¿En qué estás pensando?
        </label>
      </div>

      <input
        type="file"
        class="hidden"
        #fileInput
        (change)="onFileSelected($event)"
        accept="image/png, image/jpeg, image/webp"
      />

      @if (previewUrl(); as url) {
        <div class="relative my-4 rounded-lg border border-muted/30">
          <img [src]="url" alt="Vista previa" class="max-h-60 w-full rounded-lg object-cover" />
          <button
            type="button"
            (click)="clearFile(fileInput)"
            title="Quitar imagen"
            class="absolute top-2 right-2 flex h-8 w-8 items-center justify-center rounded-full bg-danger/80 text-white shadow-lg transition-all hover:scale-110 hover:bg-danger"
          >
            <span class="text-xl font-bold leading-none">&times;</span>
          </button>
        </div>
      }

      <div class="mt-4 flex items-center justify-between">
        <button
          type="button"
          (click)="fileInput.click()"
          title="Agregar imagen"
          class="flex items-center gap-2 rounded-lg py-2 px-3 text-primary transition-all hover:bg-primary/20"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
          <span class="text-sm font-medium">Imagen</span>
        </button>

        <button
          type="submit"
          [disabled]="postForm.invalid || isLoading()"
          class="transform rounded-lg bg-primary px-6 py-2.5 font-bold text-background shadow-md transition-all duration-300 ease-in-out hover:scale-[1.02] hover:shadow-lg hover:shadow-primary/30 disabled:opacity-50"
        >
          @if (isLoading()) {
            <div class="mx-auto h-5 w-5 animate-spin rounded-full border-2 border-background border-t-transparent"></div>
          } @else {
            Spark!
          }
        </button>
      </div>
    </div>
  </div>
</form>
