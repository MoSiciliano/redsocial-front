@if (modalService.isOpen()) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4" (click)="cancel()">
    <div class="relative w-full max-w-md rounded-lg bg-card p-6 shadow-lg" (click)="$event.stopPropagation()">
        <h3 class="text-xl font-bold text-primary">{{ modalService.title() }}</h3>
        <p class="mt-2 text-text">{{ modalService.message() }}</p>

        <div class="mt-6 flex justify-end gap-3">
            @if (!modalService.isConfirmation()) {
            <button (click)="cancel()"
                class="rounded-md bg-primary px-4 py-2 text-sm font-medium text-background transition-colors hover:bg-primary/80">
                Cerrar
            </button>
            } @else {
            <button (click)="cancel()"
                class="rounded-md bg-gray-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-gray-500">
                Cancelar
            </button>
            <button (click)="confirm()"
                class="rounded-md bg-primary px-4 py-2 text-sm font-medium text-background transition-colors hover:bg-primary/80">
                Extender Sesión
            </button>
            }
        </div>
    </div>
</div>
}
