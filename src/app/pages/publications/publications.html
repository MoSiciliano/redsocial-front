<app-navbar />

<main class="container mx-auto max-w-2xl px-4 py-8">
  <app-create-post (postCreated)="onPostCreated($event)" />

  <div class="mt-8">
    <h2 class="mb-4 text-2xl font-semibold text-maintext">Últimos Sparks</h2>

    @if (isLoading()) { } @if (!isLoading() && posts().length === 0) { } @if (!isLoading() &&
    posts().length > 0) {
    <div class="space-y-6">
      @for (post of posts(); track post._id) {
      <div class="rounded-xl border border-muted/20 bg-card/60 p-6 shadow-lg backdrop-blur-lg">
        <div class="flex items-center gap-3">
          <img [src]="post.autor.imageProfile" alt="Avatar de {{ post.autor.username }}"
            class="h-10 w-10 rounded-full object-cover" />
          <span class="font-semibold text-maintext">{{ post.autor.username }}</span>
        </div>

        <h3 class="mt-4 text-xl font-bold text-primary">{{ post.title }}</h3>
        <p class="mt-2 text-maintext/90">{{ post.message }}</p>

        @if (post.imageUrl) {
        <img [src]="post.imageUrl" alt="Imagen del post" class="mt-4 w-full rounded-lg object-cover" />
        }

        <div class="mt-4 pt-4 border-t border-muted/20 flex items-center gap-4">
          <button (click)="onLikeToggle(post)"
            class="flex items-center gap-1.5 text-muted transition-colors hover:text-danger"
            [class.text-danger]="isPostLikedByUser(post)">
            <div class="h-6 w-6 flex-shrink-0">
              @if(isPostLikedByUser(post)) {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-full w-full">
                <path
                  d="M11.645 20.91a.75.75 0 0 1-1.29 0C8.322 16.53 4.5 12.43 4.5 9.75 4.5 6.55 7.05 4 10.125 4c1.779 0 3.25.796 4.295 2.051a.75.75 0 0 0 1.159 0C16.625 4.796 18.1 4 19.875 4 22.95 4 25.5 6.55 25.5 9.75c0 2.68-3.822 6.78-5.83 11.16Z"
                  clip-rule="evenodd" />
              </svg>
              } @else {
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="h-full w-full">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
              </svg>
              }
            </div>

            <span class="text-sm font-medium">{{ post.likes.length }}</span>
          </button>
        </div>
      </div>
      }
    </div>
    }
  </div>
</main>
