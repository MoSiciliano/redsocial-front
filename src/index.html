<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>SparkIt</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg" href="../public/FAVICO.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Configuración de Tailwind con la paleta "NOCHE DE IDEAS"
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              background: '#0A0E27', // Ultra dark azulado
              card: '#16182E', // Azul oscuro cálido
              primary: '#FFB800', // Dorado (La Chispa / Acento)
              secondary: '#6B5EFF', // Púrpura (para links)
              maintext: '#F0F3FF', // Casi blanco azulado
              muted: '#6D7492', // Muted gray/blue
              danger: '#FF4D6D', // Rosa/Rojo para errores
            },
          },
        },
      };
    </script>

    <style>
      /* Animación para que la card "caiga" suave */
      @keyframes fade-in-down {
        0% {
          opacity: 0;
          transform: translateY(-20px) scale(0.95);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Animación para las "chispas" de fondo */
      @keyframes sparkle {
        0%,
        100% {
          opacity: 0;
          box-shadow: 0 0 10px 2px #ffb800; /* Color Accent (Dorado) */
        }
        50% {
          opacity: 0.8;
          box-shadow: 0 0 20px 5px #ffb800;
        }
      }

      .animate-fade-in-down {
        animation: fade-in-down 0.5s ease-out;
      }

      /* Clases para las chispas */
      .spark {
        position: absolute;
        border-radius: 50%;
        background-color: #ffb800;
        width: 3px;
        height: 3px;
        animation: sparkle 10s ease-in-out infinite;
      }
    </style>
  </head>

  <body class="bg-background text-maintext">
    <app-root></app-root>
  </body>
</html>
